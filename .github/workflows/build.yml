name: Compilar y probar

# Se ejecuta en una máquina Windows real que administra GitHub, no la mía
# ni la de Kryo: es la primera verificación de este proyecto en un equipo
# que nadie del proyecto tocó a mano.
"on":
  push:
    branches: [ main, "arena/**" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restaurar dependencias
        run: dotnet restore SysDiag.sln

      - name: Compilar (Release)
        run: dotnet build SysDiag.sln -c Release --no-restore

      - name: Ejecutar la suite de pruebas
        run: dotnet test SysDiag.sln -c Release --no-build --verbosity minimal --logger "trx;LogFileName=tests.trx" --results-directory TestResults

      - name: Guardar resultados de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.sha }}
          path: TestResults/*.trx
          if-no-files-found: ignore

      - name: Publicar el ejecutable autocontenido
        run: dotnet publish SysDiag.csproj -c Release -o publish

      - name: Validar el paquete publicado
        shell: pwsh
        run: |
          .\Tools\validate_release.ps1 -Root .\publish

      - name: Empaquetar el release para descarga
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Compress-Archive -Path .\publish\* -DestinationPath .\release\SysDiag-${{ github.sha }}.zip -Force

      - name: Subir el artefacto de release
        uses: actions/upload-artifact@v4
        with:
          name: SysDiag-${{ github.sha }}
          path: |
            release/SysDiag-${{ github.sha }}.zip
            publish/SysDiag.exe
          retention-days: 30
