name: Compilar y probar

# Windows valida WPF, interop de archivos y los artefactos publicados.
# No se instalan drivers ni se alteran DNS, registro o energía del runner.
"on":
  push:
    branches: [ main, "arena/**" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    # El gate de documentación deja el motivo del fallo como comentario del PR:
    # los logs de una corrida fallida no siempre se pueden abrir desde la API.
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Descargar el código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Instalar .NET 8
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'

      - name: Comprobar los scripts (sintaxis y codificación)
        # Un error de análisis mata un script entero antes de ejecutar la primera
        # comprobación, y hasta hoy el CI solo decía "exit code 1": esta puerta lo
        # dice con archivo, línea y motivo. Ver la cabecera de Tools/validate_scripts.ps1.
        # Va antes que las demás puertas a propósito: comprueba que las otras puedan
        # siquiera ejecutarse. Y no pasa por run_gate.ps1 justamente por eso: es la
        # comprobación más básica y tiene que tener la menor cantidad de piezas.
        shell: pwsh
        run: |
          .\Tools\validate_scripts.ps1 -Root .

      - name: Comprobar el XAML (recursos y ámbitos de nombres)
        # Cada {StaticResource} existe, cada TargetName vive en su plantilla, la
        # propiedad animada está en el tipo del destino, cada Forever nacido en un
        # Trigger tiene su StopStoryboard, y cada {Binding X} es un miembro real:
        # WPF no avisa de nada de eso (no anima, no enlaza y sigue), así que la
        # plantilla solo se materializa al pasar el cursor, y un TargetName mal
        # escrito no rompe la construcción de la ventana — rompe el primer hover.
        shell: pwsh
        run: |
          .\Tools\run_gate.ps1 -Script .\Tools\validate_xaml.ps1

      - name: Comprobar la coherencia de la documentación
        # Versión, umbral de pruebas, referencias a secciones y nombres del README
        # contra el código. Ver la cabecera de Tools/validate_docs.ps1.
        # El lanzador publica la salida de la puerta como anotaciones (y como
        # comentario del PR): los logs de una corrida fallida no siempre se pueden
        # abrir, y un diagnóstico que solo vive ahí es un diagnóstico que nadie lee.
        shell: pwsh
        env:
          PR: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          .\Tools\run_gate.ps1 -Script .\Tools\validate_docs.ps1 -Comentar

      - name: Restaurar dependencias
        run: dotnet restore SysDiag.sln

      - name: Compilar (Release)
        run: dotnet build SysDiag.sln -c Release --no-restore

      - name: Ejecutar la suite de pruebas
        run: dotnet test SysDiag.sln -c Release --no-build --verbosity minimal --collect:"XPlat Code Coverage" --logger "trx;LogFileName=tests.trx" --results-directory TestResults

      # Cobertura medida y publicada, sin umbral todavía. Cuando se sepa la línea base de
      # Core/Storage y Core/Windows (MEJORAS §2, ítem 7) se añade un gate de no-regresión.

      - name: Resumir y verificar todas las regresiones
        if: always()
        shell: pwsh
        run: |
          .\Tools\validate_tests.ps1

      - name: Verificar el runner compartido
        shell: pwsh
        run: |
          & .\Tools\HeadlessRunner\bin\Release\net8.0-windows\win-x64\HeadlessRunner.exe --self-test
          if ($LASTEXITCODE -ne 0) { throw "Falló el autotest del runner compartido" }

      - name: Guardar resultados de pruebas
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ github.sha }}
          path: TestResults/**
          if-no-files-found: ignore

      - name: Publicar el ejecutable autocontenido
        run: dotnet publish SysDiag.csproj -c Release -o publish

      - name: Validar el paquete publicado
        shell: pwsh
        run: |
          .\Tools\validate_release.ps1 -Root .\publish
          .\Tools\validate_version.ps1 -Root .\publish

      - name: Empaquetar el release para descarga
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Compress-Archive -Path .\publish\* -DestinationPath .\release\SysDiag-${{ github.sha }}.zip -Force

      - name: Subir el artefacto de release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SysDiag-${{ github.sha }}
          path: |
            release/SysDiag-${{ github.sha }}.zip
            publish/SysDiag.exe
          retention-days: 30

  instalador:
    # Compila el setup de Inno Setup, lo instala en silencio y comprueba el EXE instalado.
    # Un job aparte porque publica otra vez; no bloquea la publicación del build principal.
    runs-on: windows-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Instalar .NET 8
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'

      - name: Instalar Inno Setup 6
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Publicar el ejecutable autocontenido
        run: dotnet publish SysDiag.csproj -c Release -o publish

      - name: Compilar el instalador
        shell: pwsh
        run: .\Tools\build_installer.ps1

      - name: Instalar, autotestear y desinstalar
        shell: pwsh
        run: |
          # El motivo del fallo tiene que verse sin abrir el log: se emite como
          # anotación de error (con el escape que piden los comandos de Actions)
          # y el paso igual termina en 1.
          try {
            .\Tools\validate_installer.ps1
          } catch {
            $mensaje = (($_ | Out-String).Trim() -replace "\r?\n", " ") -replace '%', '%25'
            if ($mensaje.Length -gt 900) { $mensaje = $mensaje.Substring(0, 900) + '...' }
            Write-Output "::error title=Instalador::$mensaje"
            exit 1
          }
