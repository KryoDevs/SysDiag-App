name: Compilar y probar

# Windows valida WPF, interop de archivos y los artefactos publicados.
# No se instalan drivers ni se alteran DNS, registro o energía del runner.
"on":
  push:
    branches: [ main, "arena/**" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    # El gate de documentación deja el motivo del fallo como comentario del PR:
    # los logs de una corrida fallida no siempre se pueden abrir desde la API.
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Descargar el código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Instalar .NET 8
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'

      - name: Comprobar el XAML (recursos y ámbitos de nombres)
        # Puerta desde la primera corrida verde sobre el tema reescrito. Es la
        # comprobación que ve lo que el autotest no puede ver: los triggers de una
        # plantilla solo se materializan al pasar el cursor, y un TargetName mal
        # escrito no rompe la construcción de la ventana — rompe el primer hover.
        shell: pwsh
        run: |
          .\Tools\validate_xaml.ps1 -Root .

      - name: Comprobar la coherencia de la documentación
        # Versión, umbral de pruebas, referencias a secciones y nombres del README
        # contra el código. Ver la cabecera de Tools/validate_docs.ps1.
        # La puerta publica avisos y errores de workflow y el runner los convierte en
        # anotaciones: se leen desde la API sin abrir (ni descargar) el log de la
        # corrida. El mismo texto queda como comentario del PR, y si el comentario no
        # se puede publicar, el motivo también se anota. Un diagnóstico que solo vive
        # en el log de una corrida fallida es un diagnóstico que nadie lee.
        shell: pwsh
        env:
          PR: ${{ github.event.pull_request.number }}
        run: |
          # La puerta corre en un proceso hijo y su salida se vuelca a un archivo:
          # mezclar la salida de error de un proceso nativo en la canalización de
          # PowerShell es la clase de detalle que hace caer un paso por un motivo
          # distinto del que se está depurando.
          $ErrorActionPreference = 'Continue'
          $registro = Join-Path $env:RUNNER_TEMP 'gate-docs.log'
          & pwsh -NoProfile -File .\Tools\validate_docs.ps1 -Root . *> $registro
          $codigo = $LASTEXITCODE
          $salida = if (Test-Path -LiteralPath $registro) { (Get-Content -LiteralPath $registro -Raw) } else { '' }
          $salida = ($salida -replace "`r", '').Trim()
          if ($salida.Length -gt 6000) { $salida = $salida.Substring(0, 6000) + ' ...' }
          Write-Output $salida
          if ($codigo -eq 0) { exit 0 }
          if ($salida.Length -eq 0) {
            Write-Output "::error title=DocGate::la puerta terminó con código $codigo sin escribir nada: el problema es anterior a la puerta"
          }
          # Una anotación por línea del diagnóstico, para no depender del log. Las
          # líneas que ya son comandos de workflow las procesó el runner al imprimir.
          foreach ($linea in @($salida -split "`n" | Where-Object { $_.Trim().Length -gt 0 } | Select-Object -First 8)) {
            if ($linea.Trim().StartsWith('::')) { continue }
            Write-Output "::error title=DocGate::$($linea.Trim())"
          }
          if ($env:PR) {
            $sha = $env:GITHUB_SHA.Substring(0, 7)
            $uri = "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/issues/$env:PR/comments"
            $cabeceras = @{ Authorization = "Bearer $env:GITHUB_TOKEN"; Accept = 'application/vnd.github+json' }
            $grave = [string][char]0x60
            $cercado = $grave + $grave + $grave
            $primeraLinea = "La puerta de documentación falló en $sha"
            try {
              $previos = Invoke-RestMethod -Uri $uri -Headers $cabeceras
              if (@($previos | Where-Object { $_.body -like "$primeraLinea*" }).Count -gt 0) {
                Write-Output '::notice title=DocGate::ya hay un comentario de esta revisión; no se duplica'
              } else {
                $cuerpo = $primeraLinea + " (código $codigo).`n`n$cercado" + "text`n$salida`n$cercado"
                $json = @{ body = $cuerpo } | ConvertTo-Json -Depth 2
                Invoke-RestMethod -Method Post -Uri $uri -Headers $cabeceras -ContentType 'application/json; charset=utf-8' -Body ([Text.Encoding]::UTF8.GetBytes($json)) | Out-Null
                Write-Output '::notice title=DocGate::el motivo quedó como comentario del PR'
              }
            } catch {
              $motivo = ($_.Exception.Message -replace "`r?`n", ' ')
              Write-Output "::error title=Comentario::no se pudo publicar el comentario del PR: $motivo"
            }
          }
          exit 1

      - name: (temporal) Comprobar el canal de anotaciones
        # Control positivo mientras se depura la puerta de documentación: si esta
        # anotación no aparece en la corrida, el canal no sirve y hay que buscar
        # otro. Se borra en cuanto el CI esté verde.
        if: always()
        shell: pwsh
        run: |
          Write-Output '::notice title=DiagnosticoCI::el canal de anotaciones funciona'

      - name: Restaurar dependencias
        run: dotnet restore SysDiag.sln

      - name: Compilar (Release)
        run: dotnet build SysDiag.sln -c Release --no-restore

      - name: Ejecutar la suite de pruebas
        run: dotnet test SysDiag.sln -c Release --no-build --verbosity minimal --collect:"XPlat Code Coverage" --logger "trx;LogFileName=tests.trx" --results-directory TestResults

      # Cobertura medida y publicada, sin umbral todavía. Cuando se sepa la línea base de
      # Core/Storage y Core/Windows (MEJORAS §2, ítem 7) se añade un gate de no-regresión.

      - name: Resumir y verificar todas las regresiones
        if: always()
        shell: pwsh
        run: |
          .\Tools\validate_tests.ps1

      - name: Verificar el runner compartido
        shell: pwsh
        run: |
          & .\Tools\HeadlessRunner\bin\Release\net8.0-windows\win-x64\HeadlessRunner.exe --self-test
          if ($LASTEXITCODE -ne 0) { throw "Falló el autotest del runner compartido" }

      - name: Guardar resultados de pruebas
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ github.sha }}
          path: TestResults/**
          if-no-files-found: ignore

      - name: Publicar el ejecutable autocontenido
        run: dotnet publish SysDiag.csproj -c Release -o publish

      - name: Validar el paquete publicado
        shell: pwsh
        run: |
          .\Tools\validate_release.ps1 -Root .\publish
          .\Tools\validate_version.ps1 -Root .\publish

      - name: Empaquetar el release para descarga
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Compress-Archive -Path .\publish\* -DestinationPath .\release\SysDiag-${{ github.sha }}.zip -Force

      - name: Subir el artefacto de release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SysDiag-${{ github.sha }}
          path: |
            release/SysDiag-${{ github.sha }}.zip
            publish/SysDiag.exe
          retention-days: 30

  instalador:
    # Compila el setup de Inno Setup, lo instala en silencio y comprueba el EXE instalado.
    # Un job aparte porque publica otra vez; no bloquea la publicación del build principal.
    runs-on: windows-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Instalar .NET 8
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'

      - name: Instalar Inno Setup 6
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Publicar el ejecutable autocontenido
        run: dotnet publish SysDiag.csproj -c Release -o publish

      - name: Compilar el instalador
        shell: pwsh
        run: .\Tools\build_installer.ps1

      - name: Instalar, autotestear y desinstalar
        shell: pwsh
        run: |
          # El motivo del fallo tiene que verse sin abrir el log: se emite como
          # anotación de error (con el escape que piden los comandos de Actions)
          # y el paso igual termina en 1.
          try {
            .\Tools\validate_installer.ps1
          } catch {
            $mensaje = (($_ | Out-String).Trim() -replace "\r?\n", " ") -replace '%', '%25'
            if ($mensaje.Length -gt 900) { $mensaje = $mensaje.Substring(0, 900) + '...' }
            Write-Output "::error title=Instalador::$mensaje"
            exit 1
          }
