name: Validate fixture

on:
  push:
  pull_request:

jobs:
  validate-fixture:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate fixture (PowerShell)
        shell: pwsh
        run: |
          Write-Host "Validando fixture: Tools\fixtures\diagnostico_fixture.json"
          if (-not (Test-Path "Tools\fixtures\diagnostico_fixture.json")) {
            Write-Error "Fixture missing: Tools\fixtures\diagnostico_fixture.json"
            exit 1
          }
          pwsh -NoProfile -File Tools\validate_fixture.ps1

  run-integration-tests:
    runs-on: windows-latest
    needs: validate-fixture
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore SysDiag.sln

      - name: Build app for test references
        run: dotnet build SysDiag.sln -c Debug --no-restore

      - name: Run integration tests
        run: dotnet test "Tools/IntegrationTests/IntegrationTests.csproj" -c Debug --no-build --verbosity minimal

